<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus block active · JP Freedom</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { color: #dce7e2; font: 14px/1.4 system-ui, sans-serif; }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
      main {
        position: fixed;
        inset: auto 0 0;
        padding: 24px 16px max(18px, env(safe-area-inset-bottom));
        background: linear-gradient(transparent, #000 70%);
        text-align: center;
        pointer-events: none;
      }
      h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
      p { margin: 0; color: #a4aaa7; overflow-wrap: anywhere; }
      #blocked-activity { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
      a { display: inline-block; margin-top: 5px; padding: 4px 8px; color: #8ee5c8; pointer-events: auto; }
      a:focus-visible { outline: 2px solid #8ee5c8; outline-offset: 2px; }
      @media (max-height: 380px) { main { padding-block: 8px; } }
    </style>
  </head>
  <body>
    <iframe src="focus-terrain.html?blocked" title="JP Freedom" aria-hidden="true" tabindex="-1" sandbox="allow-scripts"></iframe>
    <main>
      <header>
        <h1>This site is blocked during your focus block</h1>
        <p id="blocked-activity">Checking your focus plan…</p>
        <p id="blocked-end" hidden></p>
        <a href="management.html">Open focus plan</a>
      </header>
    </main>
    <script type="module" src="src/blocked.js"></script>
  </body>
</html>
