<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus block active · JP Freedom</title>
    <style>
      :root { color-scheme: dark; --background: #10182b; --surface: #18233a; --text: #f2f0ea; --muted: #b4bed8; --amber: #ffc27a; --periwinkle: #aab9ff; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--background); }
      body { color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
      main {
        position: fixed;
        inset: auto 0 0;
        padding: 22px 24px max(20px, env(safe-area-inset-bottom));
        border-top: 1px solid rgb(170 185 255 / .24);
        border-radius: 20px 20px 0 0;
        background: linear-gradient(180deg, rgb(24 35 58 / .92), #10182b 48%);
        text-align: center;
        pointer-events: none;
      }
      header { width: min(100%, 680px); margin: 0 auto; }
      h1 { margin: 0 0 6px; color: var(--amber); font-size: clamp(1rem, 2vw, 1.2rem); font-weight: 700; }
      p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
      #blocked-activity { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
      a { display: inline-block; min-height: 44px; margin-top: 8px; padding: 10px 12px; border-radius: 999px; color: var(--periwinkle); font-weight: 700; pointer-events: auto; }
      a:hover { background: rgb(170 185 255 / .12); }
      a:focus-visible { outline: 3px solid var(--periwinkle); outline-offset: 3px; }
      @media (max-width: 520px) { main { padding-inline: 16px; } }
      @media (max-height: 380px) { main { padding-block: 8px; } h1 { font-size: 1rem; } }
    </style>
  </head>
  <body>
    <iframe src="focus-terrain.html?blocked" title="JP Freedom" aria-hidden="true" tabindex="-1" sandbox="allow-scripts"></iframe>
    <main>
      <header>
        <h1>This site is blocked during your focus time</h1>
        <p id="blocked-activity">Checking your focus plan…</p>
        <p id="blocked-end" hidden></p>
        <a href="management.html">Open focus management</a>
      </header>
    </main>
    <script type="module" src="src/blocked.js"></script>
  </body>
</html>
