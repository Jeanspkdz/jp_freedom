<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="src/page-entry.js"></script>
    <link rel="stylesheet" href="blocked.css">
    <title>Focus block active · Tally</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #10182b;
        --surface: #18233a;
        --surface-variant: #222e47;
        --ink: #f2f0ea;
        --muted: #b4bed8;
        --line: #34415d;
        --amber: #ffc27a;
        --on-amber: #402d12;
        --purple: #b39ddb;
        --on-purple: #2e243d;
        --purple-container: #47395f;
        --on-purple-container: #ebddff;
        font: 400 16px/1.5 "JP Roboto", Roboto, Arial, sans-serif;
        background: var(--background);
        color: var(--ink);
      }
      @font-face {
        font-family: "JP Roboto";
        src: url("Roboto.ttf") format("truetype");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; background: var(--background); }
      body { min-height: 100vh; }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: .08; pointer-events: none; }
      main { position: relative; display: grid; min-height: 100vh; place-items: center; padding: 24px; }
      .blocked-card {
        width: min(680px, 100%);
        padding: clamp(24px, 5vw, 48px);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        text-align: center;
      }
      .brand { margin-bottom: 22px; font-size: 1.1rem; font-weight: 700; }
      .blocked-symbol { width: 36px; height: 36px; margin: 0 auto 12px; color: var(--amber); }
      h1 { max-width: 25ch; margin: 0 auto 22px; font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.16; letter-spacing: -.025em; }
      p { margin: 0; overflow-wrap: anywhere; }
      .blocked-info { display: grid; gap: 8px; max-width: 500px; margin: 0 auto; }
      .blocked-info-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 16px; border-radius: 12px; background: var(--surface-variant); text-align: left; }
      .blocked-label { color: var(--muted); font-size: .9rem; }
      #blocked-activity, #blocked-end { color: var(--ink); font-weight: 700; }
      #blocked-activity { max-width: 25ch; }
      #blocked-end[hidden] { display: none; }
      a { display: inline-block; margin-top: 22px; padding: 6px 2px; color: var(--amber); font-weight: 700; text-underline-offset: 4px; }
      a:focus-visible, select:focus-visible { outline: 3px solid var(--purple); outline-offset: 3px; }
      .appearance { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 22px; color: var(--muted); font-size: .84rem; }
      .appearance select { min-height: 40px; padding: 6px 12px; border: 1px solid var(--purple); border-radius: 12px; background: var(--purple-container); color: var(--on-purple-container); font: inherit; }
      @media (max-width: 480px) {
        main { padding: 16px; }
        .blocked-card { padding: 24px 18px; }
        .blocked-info-row { align-items: flex-start; flex-direction: column; gap: 3px; }
      }
      @media (max-height: 380px) { main { min-height: 380px; padding-block: 12px; } .blocked-card { padding: 18px; } }
      @media (prefers-reduced-motion: reduce) { iframe { opacity: .04; } }
    </style>
  </head>
  <body>
    <iframe id="blocked-scene" src="focus-terrain.html?blocked" title="Tally" aria-hidden="true" tabindex="-1" sandbox="allow-scripts"></iframe>
    <main>
      <section class="blocked-card" aria-labelledby="blocked-heading">
        <p class="brand">Tally</p>
        <svg class="blocked-symbol" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="15" stroke="currentColor" stroke-width="2.5"/><path d="m9 9 22 22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <h1 id="blocked-heading" tabindex="-1" data-enter data-i="1">This site is blocked during your focus block</h1>
        <div class="blocked-info" data-enter data-i="2">
          <div class="blocked-info-row"><p class="blocked-label">Current activity</p><p id="blocked-activity" role="status">Checking your focus plan…</p></div>
          <div class="blocked-info-row" id="blocked-end-row"><p class="blocked-label">Available again at</p><p id="blocked-end"></p></div>
        </div>
        <a href="management.html" data-enter data-i="3">Open focus management</a>
        <div class="appearance" data-enter data-i="4"><label for="blocked-variant">Appearance</label><select id="blocked-variant"><option value="particles">Particles</option><option value="water">Rainy puddle</option></select></div>
      </section>
    </main>
    <script type="module" src="src/blocked.js"></script>
  </body>
</html>
