<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JP Freedom Focus Blocklist</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup">
    <main>
      <header class="heading">
        <div class="mark" aria-hidden="true">JF</div>
        <div>
          <p class="eyebrow">JP FREEDOM</p>
          <h1>Focus blocklist</h1>
        </div>
      </header>

      <section class="panel" aria-live="polite">
        <p class="eyebrow">NOW</p>
        <p class="focus-state" id="current-block">Loading schedule…</p>
        <div class="next-row" id="next-row" hidden>
          <p class="eyebrow">UP NEXT</p>
          <p id="next-block"></p>
        </div>
      </section>

      <section class="notice warning" id="site-permission-panel" hidden>
        <p id="site-permission-message"></p>
        <button class="secondary" id="grant-site-access">Allow site access</button>
      </section>

      <section class="notice warning" id="api-permission-panel" hidden>
        <p>Chrome needs access to the sync API host before it can refresh this snapshot.</p>
        <button class="secondary" id="open-settings">Open Settings</button>
      </section>

      <section class="notice error" id="sync-error-panel" hidden>
        <p id="sync-error"></p>
      </section>

      <section class="notice error" id="enforcement-error-panel" hidden>
        <p id="enforcement-error"></p>
      </section>

      <p class="sync-meta" id="sync-revision">Chrome has not fetched a server revision yet.</p>
      <div class="actions">
        <button id="sync-now">Sync now</button>
        <button class="text-button" id="settings">Settings</button>
      </div>
      <p class="status-message" id="status-message" role="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
